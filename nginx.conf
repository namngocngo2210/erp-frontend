# Cache-Control theo URI qua `map` thay vì `add_header` trong từng location: nginx
# KHÔNG kế thừa add_header khi location có add_header riêng, nên đặt security
# header ở server-level rồi thêm Cache-Control trong location là mất sạch header
# bảo mật ở /assets/ và index.html (audit 2026-09-23 M4). Giá trị rỗng = không
# thêm header.
map $uri $desi_cache_control {
  ~^/assets/                       "public, max-age=31536000, immutable";
  ~^/(index|webphone)\.html$       "no-cache, no-store, must-revalidate";
  default                          "";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Không lộ phiên bản nginx trong header/trang lỗi.
  server_tokens off;

  # ── Security header cho SPA (audit 2026-09-23 M4) ──
  # HSTS: vhost host đã ép HTTPS; header đặt ở đây để phủ cả HTML/JS (Django
  # SecurityMiddleware chỉ phủ /api/). `always` = kể cả 404/5xx.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  # SAMEORIGIN chứ không DENY: webphone.html chạy trong iframe cùng origin.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
  # CSP ở chế độ Report-Only trước: SPA Vite (script module 'self'), webphone
  # iframe nạp jQuery/JSSIP từ ajax.googleapis.com + cdn.zenify.biz, Sentry/API/WS
  # qua https:/wss:. Theo dõi console/report vài tuần rồi mới đổi sang
  # Content-Security-Policy thật (không đổi ở đây kẻo vỡ webphone giữa ca).
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://ajax.googleapis.com https://cdn.zenify.biz; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Cache-Control $desi_cache_control always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Sourcemap KHÔNG được phục vụ công khai. vite.config.ts đặt `sourcemap: "hidden"`
  # và nhờ Sentry xoá .map sau khi upload, nhưng bước xoá đó chỉ chạy KHI có
  # SENTRY_AUTH_TOKEN — build không token sẽ để .map nằm lại trong dist (file .map
  # hiện tại còn to hơn cả bundle). Chặn ở nginx để không phụ thuộc biến môi trường
  # lúc build. Location regex luôn được xét trước location prefix nên khối này
  # thắng /assets/ dù .map có nằm trong đó.
  location ~ \.map$ {
    return 404;
  }

  # File trong /assets/ đều mang content-hash trong tên (index-ByvYMspt.js), nội
  # dung đổi thì TÊN đổi — nên không có lý do gì để trình duyệt quay lại hỏi.
  # `7d` trước đây bắt mọi người dùng revalidate mỗi tuần một cách vô ích;
  # 1 năm + immutable là mức đúng cho tài nguyên có vân tay nội dung.
  # Cache-Control cho /assets/, index.html, webphone.html (không hash trong tên,
  # cache stale làm lệch giao thức postMessage với bundle mới) đặt ở map
  # $desi_cache_control phía trên — không add_header trong location (xem ghi chú).
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
